---
- name: Install history hotkeys, if inputrc wasn't defined before
  blockinfile:
    state: present
    path: "{{ workspace_setup_home }}/.inputrc"
    create: yes
    block: |
      "\e[A": history-search-backward
      "\e[B": history-search-forward
      "\e[C": forward-char
      "\e[D": backward-char
