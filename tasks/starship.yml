---
- name: Check if Starship is installed
  command: which starship
  register: starship_check
  failed_when: false
  changed_when: false

- name: Check if FiraCode Nerd Font is installed
  stat:
    path: "{{ workspace_setup_home }}/.local/share/fonts/FiraCodeNerdFont-Regular.ttf"
  register: firacode_font_check

- name: Install FiraCode Nerd Font
  block:
    - name: Create font directory
      file:
        path: "{{ workspace_setup_home }}/.local/share/fonts"
        state: directory
        mode: '0755'

    - name: Download FiraCode Nerd Font
      get_url:
        url: "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/FiraCode.zip"
        dest: "/tmp/FiraCode.zip"
        mode: '0644'

    - name: Extract FiraCode Nerd Font
      unarchive:
        src: "/tmp/FiraCode.zip"
        dest: "{{ workspace_setup_home }}/.local/share/fonts"
        remote_src: yes

    - name: Rebuild font cache
      command: fc-cache -fv {{ workspace_setup_home }}/.local/share/fonts
      changed_when: false
  when: not firacode_font_check.stat.exists

- name: Install Starship
  block:
    - name: Download and install Starship
      shell: curl -sS https://starship.rs/install.sh | sh -s -- -y
      args:
        executable: /bin/bash
      environment:
        PATH: "{{ ansible_env.PATH }}:/usr/local/bin"
  when: starship_check.rc != 0

- name: Initialize Starship in bashrc
  lineinfile:
    path: "{{ workspace_setup_home }}/.bashrc"
    line: 'eval "$(starship init bash)"'
    state: present
    create: yes

- name: Remove bash-it initialization from bashrc
  lineinfile:
    path: "{{ workspace_setup_home }}/.bashrc"
    regexp: "{{ item }}"
    state: absent
  loop:
    - '^\s*source.*\.bash_it/bash_it\.sh'
    - '^\s*export BASH_IT_THEME='
    - '^\s*\[\[.*\.bash_it/bash_it\.sh.*\]\].*source'

- name: Create Starship config directory
  file:
    path: "{{ workspace_setup_home }}/.config"
    state: directory
    mode: '0755'

- name: Copy Starship configuration
  copy:
    src: starship.toml
    dest: "{{ workspace_setup_home }}/.config/starship.toml"
    mode: '0644'
    force: no
