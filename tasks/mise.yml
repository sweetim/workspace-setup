---
- name: Check if mise is already installed
  stat:
    path: "{{ workspace_setup_home }}/.local/bin/mise"
  register: mise_binary

- name: Install mise
  shell: |
    set -euo pipefail
    curl https://mise.run | sh
  args:
    executable: /bin/bash
  when: not mise_binary.stat.exists

- name: Ensure mise is activated in bash profile
  lineinfile:
    path: "{{ workspace_setup_home }}/.bashrc"
    line: 'eval "$({{ workspace_setup_home }}/.local/bin/mise activate bash)"'
    create: yes
    state: present
