---
- name: Install VIM and powerline fonts
  become: yes
  apt:
    name:
      - vim
      - fonts-powerline
    state: present
- name: Clone Vundle VIM repository
  git:
    repo: "https://github.com/VundleVim/Vundle.vim.git"
    dest: "{{ workspace_setup_home }}/.vim/bundle/Vundle.vim"
    clone: yes
    force: yes
    depth: 1
- name: Config VIM
  blockinfile:
    state: present
    path: "{{ workspace_setup_home }}/.vimrc"
    marker: '"{mark} ANSIBLE MANAGED BLOCK'
    create: yes
    block: "{{ lookup('file', role_path ~ '/files/vimrc') }}"

- name: Install VIM Vundle plugins
  shell: |
    set -o pipefail
    vim +PluginInstall +qall &> /dev/null
    vim +PluginClean! +qall &> /dev/null
  args:
    executable: /bin/bash
  changed_when: False
