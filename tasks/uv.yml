---
- name: Check if uv is available
  stat:
    path: "{{ workspace_setup_home }}/.local/bin/uv"
  register: uv_binary

- name: Install uv (Astral) for current user
  shell: |
    set -euo pipefail
    curl -LsSf https://astral.sh/uv/install.sh | sh
  args:
    executable: /bin/bash
  when: not uv_binary.stat.exists
