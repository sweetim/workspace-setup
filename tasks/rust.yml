---
- name: Ensure mise is available (required to install Rust)
  stat:
    path: "{{ workspace_setup_home }}/.local/bin/mise"
  register: mise_binary

- name: Fail if mise is not installed
  fail:
    msg: >-
      The 'mise' component is required to install Rust but was not found.
      Make sure 'mise' is enabled and runs before 'rust' in
      workspace_setup_components.
  when: not mise_binary.stat.exists

- name: Check if Rust is already managed by mise
  stat:
    path: "{{ workspace_setup_home }}/.local/share/mise/installs/rust"
  register: mise_rust_install

- name: Check for a standalone rustup binary
  stat:
    path: "{{ workspace_setup_home }}/.cargo/bin/rustup"
  register: standalone_rustup

- name: Remove standalone rustup installation
  command: "{{ standalone_rustup.stat.path }} self uninstall -y"
  when:
    - standalone_rustup.stat.exists
    - not mise_rust_install.stat.exists

- name: Install Rust latest via mise
  shell: |
    set -euo pipefail
    {{ workspace_setup_home }}/.local/bin/mise use --global rust@latest
  args:
    executable: /bin/bash
    creates: "{{ workspace_setup_home }}/.local/share/mise/installs/rust"
