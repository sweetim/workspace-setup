[defaults]

# avoid "empty hosts list" warnings when the playbook targets localhost
inventory = localhost,

# human readable errors
stdout_callback = default

[callback_default]
# emit result data as YAML (replaces the removed community.general.yaml callback)
result_format = yaml

[privilege_escalation]
# Ubuntu 26.04 defaults to sudo-rs, whose prompt Ansible's sudo become plugin
# cannot recognize (it times out). Use the classic C sudo instead.
become_exe = /usr/bin/sudo.ws
